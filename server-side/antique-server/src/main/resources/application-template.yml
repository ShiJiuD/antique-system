# ===================
# Antique Server 配置模板
# 复制此文件为 application.yml 并填入真实配置
# ===================

server:
  port: 8080

spring:
  application:
    name: antique-server

  datasource:
    url: jdbc:mysql://localhost:3306/antique?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: your_password
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      # 连接池配置
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4

  # ===== RabbitMQ（M1 行为流水埋点）=====
  # 本地开发建议走 SSH 隧道连云端：host=127.0.0.1，port=隧道映射端口（如 25672 → 云端 5672）
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: your_rabbitmq_user
    password: your_rabbitmq_password
    virtual-host: /
    # ===== 发布确认（可靠投递基础）=====
    publisher-confirm-type: correlated   # 消息是否到达交换机的异步回调
    publisher-returns: true              # 路由失败时把消息退回（需配合下面的 mandatory）
    template:
      # ⚠️ 必须为 true：否则「消息到了交换机但没路由到队列」时不会触发 ReturnsCallback，
      #    消息会被静默丢弃 —— 只开 publisher-returns 是不够的
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual   # 手动 ack（默认是 auto，必须改）
        prefetch: 20               # 每次预取 20 条，防止消费者被压垮
        retry:
          enabled: false           # 重试交给死信队列处理

  # ===== Nacos 服务发现（M5 微服务）=====
  # 主服务注册到 Nacos，才能按服务名发现 antique-search；
  # 服务名必须与搜索服务的 spring.application.name 完全一致
  cloud:
    nacos:
      discovery:
        server-addr: 192.168.25.100:8848

    # ===== OpenFeign 客户端配置（M5）=====
    # 按被调服务分别配超时；Feign 默认是 connect 10s / read 60s，对多数接口都太长
    openfeign:
      client:
        config:
          antique-search:            # 搜索服务（ES 查询）
            connectTimeout: 2000
            readTimeout: 5000
          ai-service:                # Python ai-side（LLM 生成，慢）
            connectTimeout: 5000
            readTimeout: 60000
          algorithm-service:         # Python algorithm-side（本地预测，快）
            connectTimeout: 3000
            readTimeout: 3000

  profiles:
    active: dev

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # SQL 日志由 logback-spring.xml 控制：
    # - 开发/测试环境：com.antique.mapper=DEBUG 输出 SQL
    # - 生产环境：自动关闭
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted_time    # 逻辑删除字段
      logic-delete-value: "NOW()"         # 删除时写入当前时间
      logic-not-delete-value: "null"      # 未删除时为 NULL

# ===== Logging =====
# logback-spring.xml 提供完整的日志策略（控制台、文件滚动、错误分离、多环境）
logging:
  level:
    root: INFO
    com.antique: DEBUG

# Knife4j 接口文档
knife4j:
  enable: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# 阿里云 OSS
aliyun:
  oss:
    endpoint: oss-cn-xxx.aliyuncs.com
    access-key-id: your_access_key
    access-key-secret: your_secret_key
    bucket-name: your_bucket

# Redis Token 认证
antique:
  auth:
    token-header: Authorization        # 请求头中 token 的 key
    token-ttl: 604800                  # token 有效期（秒），默认 7 天
    token-prefix: antique:token:       # Redis 中 token 的 key 前缀

# AI 助手（Python 服务地址，ai-side 的 FastAPI 服务）
ai:
  python:
    url: http://127.0.0.1:8001

# 销量预测服务（Python 服务地址，algorithm-side 的 FastAPI 服务）
# M1 行为流水的下游：读取 daily_stats 近 7 天数据，返回未来 7 天预测；
# 服务未启动时接口自动降级（predictAvailable=false），不影响统计查询本身
algorithm:
  python:
    url: http://127.0.0.1:8002

# Elasticsearch（M2 搜索）
# 建议跑在本地虚拟机/本机 Docker 上并配静态 IP，避免地址漂移：
#   Docker：docker run -d --name es -p 9200:9200 -e "discovery.type=single-node" \
#             -e "ES_JAVA_OPTS=-Xms512m -Xmx512m" elasticsearch:7.12.1
# 中文检索必须装 analysis-ik 分词器（版本需与 ES 一致）
es:
  url: http://192.168.25.100:9200
